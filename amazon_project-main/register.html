<!DOCTYPE html>
<html>
  <head>
    <title>Amazon Registration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <link rel="stylesheet" href="styles/shared/general.css">
    
    <style>
      /* რეგისტრაციის გვერდის სპეციფიკური დიზაინი */
      body {
        background-color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 30px;
      }
      .amazon-logo {
        width: 100px;
        margin-bottom: 15px;
      }
      .register-container {
        border: 1px solid #ddd;
        border-radius: 4px;
        padding: 20px 26px;
        width: 350px;
        box-sizing: border-box;
      }
      h1 {
        font-weight: 400;
        font-size: 28px;
        margin-bottom: 20px;
        margin-top: 0;
      }
      label {
        font-weight: 700;
        font-size: 13px;
        display: block;
        margin-bottom: 5px;
      }
      input {
        width: 100%;
        padding: 8px;
        margin-bottom: 15px;
        border: 1px solid #a6a6a6;
        border-radius: 3px;
        box-sizing: border-box;
      }
      input:focus {
        border-color: #e77600;
        box-shadow: 0 0 3px 2px rgba(228, 121, 17, 0.5);
        outline: none;
      }
      .register-button {
        width: 100%;
        background-color: #f0c14b;
        border: 1px solid #a88734;
        border-radius: 3px;
        padding: 8px;
        cursor: pointer;
        font-size: 13px;
      }
      .register-button:hover {
        background-color: #f4d078;
      }
      .message {
        margin-top: 15px;
        font-size: 13px;
        display: none;
      }
      .error { color: #c40000; }
      .success { color: #007600; font-weight: bold; }
      
      .login-link {
        font-size: 12px;
        margin-top: 20px;
        padding-top: 15px;
        border-top: 1px solid #eee;
      }
      .login-link a { color: #0066c0; text-decoration: none; }
      .login-link a:hover { text-decoration: underline; color: #c45500; }
    </style>
  </head>
  <body>

    <a href="amazon.html">
      <img class="amazon-logo" src="images/amazon-logo.png" alt="Amazon Logo">
    </a>

    <div class="register-container">
      <h1>Create account</h1>

      <form id="register-form">
        <label for="username">Your name</label>
        <input type="text" id="username" placeholder="First and last name" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 6 characters" required>

        <button type="submit" class="register-button">Continue</button>
      </form>

      <div class="message error js-error-message"></div>
      <div class="message success js-success-message">Account created successfully!</div>
      
      <div class="login-link">
        Already have an account? <a href="#">Sign in</a>
      </div>
    </div>

    <script type="module" src="register.js"></script>

  </body>
</html>
